<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Dance Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="site-label">A Curated Encyclopedia</div>
    <h1>World <em>Dance</em><br>Atlas</h1>
    <p class="subtitle">Explore 24 dance traditions from across the globe</p>
  </header>

  <div class="controls">
    <div class="filter-group">
      <span class="filter-label">Type</span>
      <button class="pill active" data-filter-type="all">All</button>
      <button class="pill" data-filter-type="Classical">Classical</button>
      <button class="pill" data-filter-type="Semi-Classical">Semi-Classical</button>
      <button class="pill" data-filter-type="Folk">Folk</button>
      <button class="pill" data-filter-type="Contemporary">Contemporary</button>
      <button class="pill" data-filter-type="Street">Street</button>
      <button class="pill" data-filter-type="Ceremonial">Ceremonial</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">Sort</span>
      <select class="sort-select" id="sortSelect">
        <option value="default">Default</option>
        <option value="alpha-asc">A → Z</option>
        <option value="alpha-desc">Z → A</option>
        <option value="rarity-asc">Rarity: Common first</option>
        <option value="rarity-desc">Rarity: Legendary first</option>
        <option value="skill-asc">Skill: Beginner first</option>
        <option value="skill-desc">Skill: Master first</option>
      </select>
    </div>
    <span class="results-count" id="resultsCount">24 dances</span>
  </div>

  <div class="grid-container">
    <div class="dance-grid" id="danceGrid"></div>
  </div>

  <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">🌙</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-banner" id="modalBanner"></div>
      <div class="modal-body">
        <div class="modal-type" id="modalType"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-origin" id="modalOrigin"></div>
        <div class="modal-badges" id="modalBadges"></div>
        <div class="modal-divider"></div>
        <div class="modal-section-label">About this dance</div>
        <p class="modal-description" id="modalDesc"></p>
        <div class="modal-divider"></div>
        <div class="modal-section-label">Key Facts</div>
        <div class="modal-facts" id="modalFacts"></div>
        <div class="modal-divider"></div>
        <div class="modal-section-label">Similar Dance Forms</div>
        <div class="similar-grid" id="modalSimilar"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
