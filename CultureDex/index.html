<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Dance Atlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ══ HERO ══ -->
  <section class="hero">
    <canvas id="heroCanvas"></canvas>
    <div class="hero-eyebrow">A Curated Encyclopedia</div>
    <h1 class="hero-title">
      <span class="line1">World</span>
      <span class="line2">Dance</span>
      <span class="line3">Atlas</span>
    </h1>
    <p class="hero-sub">
      Twenty-four living traditions from every corner of the globe — each a universe of movement, memory, and meaning.
    </p>
    <div class="hero-stats">
      <div class="stat-item">
        <span class="stat-num" data-target="24">0</span>
        <span class="stat-label">Traditions</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" data-target="6">0</span>
        <span class="stat-label">Continents</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" data-target="4">0</span>
        <span class="stat-label">Rarities</span>
      </div>
    </div>
    <div class="scroll-cue">
      <div class="scroll-line"></div>
      Scroll to explore
    </div>
  </section>

  <!-- ══ CONTROLS ══ -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search dances, regions…" autocomplete="off">
    </div>
    <div class="sep"></div>
    <span class="filter-label">Type</span>
    <div class="pills">
      <button class="pill active" data-filter-type="all">All</button>
      <button class="pill" data-filter-type="Classical">Classical</button>
      <button class="pill" data-filter-type="Semi-Classical">Semi-Classical</button>
      <button class="pill" data-filter-type="Folk">Folk</button>
      <button class="pill" data-filter-type="Contemporary">Contemporary</button>
      <button class="pill" data-filter-type="Street">Street</button>
      <button class="pill" data-filter-type="Ceremonial">Ceremonial</button>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="default">Default order</option>
      <option value="alpha-asc">A → Z</option>
      <option value="alpha-desc">Z → A</option>
      <option value="rarity-asc">Rarity: Common first</option>
      <option value="rarity-desc">Rarity: Legendary first</option>
      <option value="skill-asc">Skill: Beginner first</option>
      <option value="skill-desc">Skill: Master first</option>
    </select>
    <span class="results-count" id="resultsCount">24 dances</span>
  </div>

  <!-- ══ GRID ══ -->
  <div class="grid-container">
    <div class="section-bar">
      <span class="section-title" id="sectionTitle">All Dance Forms</span>
    </div>
    <div class="dance-grid" id="danceGrid"></div>
  </div>

  <!-- ══ THEME TOGGLE ══ -->
  <button class="theme-toggle" id="themeToggle" title="Toggle dark / light mode">🌙</button>

  <!-- ══ MODAL ══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalEl">
      <div class="modal-banner" id="modalBanner"></div>
      <div class="modal-body">
        <div class="modal-eyebrow"     id="modalEyebrow"></div>
        <div class="modal-title"       id="modalTitle"></div>
        <div class="modal-origin-line" id="modalOriginLine"></div>
        <div class="modal-badges-row"  id="modalBadgesRow"></div>
        <div class="modal-divider"></div>
        <div class="modal-section-label">About this Dance</div>
        <p class="modal-description"   id="modalDesc"></p>
        <div class="modal-divider"></div>
        <div class="modal-section-label">Key Facts</div>
        <div class="modal-facts"       id="modalFacts"></div>
        <div class="modal-divider"></div>
        <div class="modal-section-label">Similar Dance Forms</div>
        <div class="similar-grid"      id="modalSimilar"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
